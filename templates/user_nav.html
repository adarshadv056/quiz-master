<nav class="qm-nav">
    <div class="qm-nav__brand"><span>QM</span> {{name}}</div>
    <button class="qm-nav__toggler" onclick="this.nextElementSibling.classList.toggle('show');this.nextElementSibling.nextElementSibling.classList.toggle('show')" aria-label="Toggle navigation">&#9776;</button>
    <ul class="qm-nav__links">
        <li><a href="/user/{{name}}">Quizzes</a></li>
        <li><a href="/user/view/scores/{{name}}">Scores</a></li>
        <li><a href="/user/user_summary/{{name}}">Summary</a></li>
        <li><a href="/logout" class="nav-logout">Sign out</a></li>
    </ul>
    <form class="qm-nav__search" role="search" action="/user/search/{{name}}" method="post">
        <input type="search" name="search" placeholder="Search quizzes..." aria-label="Search" value="{{ request.form.get('search', '') }}">
        <input type="hidden" name="page" value="{{ (current_page if current_page else ('scores' if 'scores' in request.path else 'home')) | trim }}">
        <button type="submit">Search</button>
    </form>
</nav>
