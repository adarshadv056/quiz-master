<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My summary - Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    {%include 'user_nav.html'%}
    <div class="qm-page">
        <div class="qm-header">
            <h1>My progress</h1>
            <p class="qm-text-muted">A visual look at how you've been learning.</p>
        </div>
        <div class="qm-charts">
            <div class="qm-chart-card">
                <div class="qm-chart-card__title">Attempts by subject</div>
                <img src="/static/images/user_barchart.jpeg" alt="Bar chart of quiz attempts grouped by subject" draggable="false">
            </div>
            <div class="qm-chart-card">
                <div class="qm-chart-card__title">Attempts by month</div>
                <img src="/static/images/user_piechart.jpeg" alt="Pie chart of quiz attempts grouped by month" draggable="false">
            </div>
        </div>
    </div>
</body>
</html>
