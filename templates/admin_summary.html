<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin summary - Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    {%include 'admin_nav.html'%}
    <div class="qm-page">
        <div class="qm-header">
            <h1>Platform summary</h1>
            <p class="qm-text-muted">How users are performing across all subjects.</p>
        </div>
        <div class="qm-charts">
            <div class="qm-chart-card">
                <div class="qm-chart-card__title">Highest score by subject</div>
                <img src="/static/images/admin_barchart.jpeg" alt="Bar chart showing highest scores per subject" draggable="false">
            </div>
            <div class="qm-chart-card">
                <div class="qm-chart-card__title">User attempts by subject</div>
                <img src="/static/images/admin_bullseye_chart.jpeg" alt="Chart showing user attempts per subject" draggable="false">
            </div>
        </div>
    </div>
</body>
</html>
