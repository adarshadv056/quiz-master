<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not found - Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    {%if name=="Admin"%}
    {%include 'admin_nav.html'%}
    {%else%}
    {%include 'user_nav.html'%}
    {%endif%}
    <div class="qm-page">
        <div class="qm-notfound">
            <h2>{{text}}</h2>
            {%if name=="Admin"%}
            <a href="/admin/{{name}}" class="qm-btn qm-btn--primary">Back to dashboard</a>
            {%else%}
            <a href="/user/{{name}}" class="qm-btn qm-btn--primary">Back to quizzes</a>
            {%endif%}
        </div>
    </div>
</body>
</html>
