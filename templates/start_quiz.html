<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz in progress - Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
    <script>
        let timeLeft = parseInt("{{ time_left }}");
        let urgent = false;
        function startTimer() {
            let timerdisplay = document.getElementById("timer");
            let timer = setInterval(function () {
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    document.getElementById("submit_link").click();
                } else {
                    let min = Math.floor(timeLeft / 60);
                    let sec = timeLeft % 60;
                    timerdisplay.innerText = (min < 10 ? '0' : '' ) + min + ":" + ( sec < 10 ? '0' : '' ) + sec;
                    if (timeLeft <= 60 && !urgent) {
                        urgent = true;
                        timerdisplay.classList.add("urgent");
                    }
                }
                timeLeft -= 1;
                document.getElementById("time_left").value = timeLeft;
            }, 1000);
        }
        window.onload = startTimer;
    </script>
</head>
<body>
    {%include 'user_nav.html'%}
    {% set total_q = quiz.questions | length %}
    <div class="qm-quiz-active">
        <div class="qm-quiz-bar">
            <div class="qm-quiz-bar__progress">
                <span class="qm-quiz-bar__count">Question {{session.get("question_no",0) + 1}} of {{total_q}}</span>
                <div class="qm-quiz-bar__track">
                    <div class="qm-quiz-bar__fill" style="width: {{ ((session.get('question_no',0) + 1) * 100 / total_q) | round }}%"></div>
                </div>
            </div>
            <div class="qm-quiz-timer" id="timer"></div>
            <input type="hidden" id="time_left" name="time_left" value="{{ time_left }}">
        </div>

        <div class="qm-quiz-question">
            {% if mssg %}
            <div class="qm-msg qm-msg--success" style="margin-bottom:20px">{{mssg}}</div>
            {% endif %}
            <p class="qm-quiz-question__text">{{question.question_statement}}</p>
            <form action="/user/start/quiz/next_q/{{quiz.id}}/{{name}}" method="POST">
                <div class="qm-quiz-options">
                    <label class="qm-quiz-option">
                        <input type="radio" name="s_o" value="1">
                        <span class="qm-quiz-option__label">A</span>
                        <span class="qm-quiz-option__text">{{question.option1}}</span>
                    </label>
                    <label class="qm-quiz-option">
                        <input type="radio" name="s_o" value="2">
                        <span class="qm-quiz-option__label">B</span>
                        <span class="qm-quiz-option__text">{{question.option2}}</span>
                    </label>
                    <label class="qm-quiz-option">
                        <input type="radio" name="s_o" value="3">
                        <span class="qm-quiz-option__label">C</span>
                        <span class="qm-quiz-option__text">{{question.option3}}</span>
                    </label>
                    <label class="qm-quiz-option">
                        <input type="radio" name="s_o" value="4">
                        <span class="qm-quiz-option__label">D</span>
                        <span class="qm-quiz-option__text">{{question.option4}}</span>
                    </label>
                </div>
                <div class="qm-quiz-actions">
                    <button type="submit" class="qm-btn qm-btn--primary" style="flex:1">Save and next</button>
                    <a id="submit_link" href="/user/submit/quiz/{{quiz.id}}/{{name}}" class="qm-btn qm-btn--ghost">Submit all</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
