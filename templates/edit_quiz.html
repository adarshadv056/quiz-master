<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit quiz - Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    {%include 'admin_nav.html'%}
    <div class="qm-page">
        <div class="qm-card qm-card--lifted" style="max-width:560px;margin:0 auto">
            <div class="qm-card__body">
                <div class="qm-form">
                    <h2>Edit quiz</h2>
                    <p class="qm-form__subtitle">Update the schedule and details for this quiz.</p>
                    <form action="#" method="POST">
                        {% if mssg %}
                        <div class="qm-msg qm-msg--error">{{mssg}}</div>
                        {% endif %}
                        <div class="qm-field">
                            <label for="id">Chapter ID</label>
                            <input type="text" id="name" name="id" value="{{chapter_id}}" required>
                        </div>
                        <div class="qm-field">
                            <label for="date">Scheduled date</label>
                            <input type="date" id="date" name="date" value="{{quiz.date_of_quiz}}" required>
                        </div>
                        <div class="qm-field">
                            <label for="duration">Duration (hh:mm)</label>
                            <input type="text" id="duration" name="duration" value="{{quiz.time_duration}}" required>
                        </div>
                        <div class="qm-field">
                            <label for="remarks">Remarks</label>
                            <textarea id="remarks" name="remarks">{{quiz.remarks}}</textarea>
                        </div>
                        <div class="qm-flex qm-flex--gap-sm">
                            <button type="submit" class="qm-btn qm-btn--primary" style="flex:1">Save changes</button>
                            <a href="/admin/quiz_management/{{name}}" class="qm-btn qm-btn--secondary" style="flex:1">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
