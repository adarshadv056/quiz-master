<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview quiz - Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    {%include 'user_nav.html'%}
    <div class="qm-page">
        <div class="qm-header">
            <h1>Quiz preview</h1>
            <p class="qm-text-muted">Review what's in this quiz before you begin.</p>
        </div>
        <div class="qm-card qm-card--lifted" style="max-width:480px;margin:0 auto">
            <div class="qm-card__body">
                <div class="qm-user-card__row">
                    <span>Subject</span>
                    <span>{{quiz.chapter.subject.name}}</span>
                </div>
                <div class="qm-user-card__row">
                    <span>Chapter</span>
                    <span>{{quiz.chapter.name}}</span>
                </div>
                <div class="qm-user-card__row">
                    <span>Questions</span>
                    <span>{{quiz.questions | length}}</span>
                </div>
                <div class="qm-user-card__row">
                    <span>Scheduled</span>
                    <span>{{quiz.date_of_quiz}}</span>
                </div>
                <div class="qm-user-card__row">
                    <span>Duration</span>
                    <span>{{quiz.time_duration}}</span>
                </div>
                <div class="qm-btn-group" style="margin-top:20px">
                    <a href="/user/start/quiz/{{quiz.id}}/{{name}}" class="qm-btn qm-btn--primary" style="flex:1">Start quiz</a>
                    <a href="/user/{{name}}" class="qm-btn qm-btn--secondary" style="flex:1">Close</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
