<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account - Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="qm-auth">
        <div class="qm-auth__card">
            <div class="qm-auth__logo"><span>QM</span> Quiz Master</div>
            <div class="qm-form qm-form--narrow">
                <h2>Create your account</h2>
                <p class="qm-form__subtitle">Start taking quizzes in under a minute</p>
                <form action="/register" method="POST">
                    <div class="qm-field">
                        <label for="full_name">Full name</label>
                        <input type="text" id="full_name" name="user_name" placeholder="Your name" required>
                    </div>
                    <div class="qm-field">
                        <label for="email">Email address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="qm-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Choose a password" required>
                    </div>
                    <div class="qm-field">
                        <label for="qualification">Qualification</label>
                        <input type="text" id="qualification" name="qualification" placeholder="e.g. B.Sc Computer Science" required>
                    </div>
                    <div class="qm-field">
                        <label for="dob">Date of birth</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                    <button type="submit" class="qm-btn qm-btn--primary qm-btn--block qm-btn--lg">Create account</button>
                </form>
                {% if mssg %}
                <div class="qm-msg {% if mssg=='User already exists' %}qm-msg--error{% else %}qm-msg--success{% endif %}">{{mssg}}</div>
                {% endif %}
                <div class="qm-auth__footer">
                    Already have an account? <a href="/login">Sign in</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
