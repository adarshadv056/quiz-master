<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New chapter - Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    {%include 'admin_nav.html'%}
    <div class="qm-page">
        <div class="qm-card qm-card--lifted" style="max-width:560px;margin:0 auto">
            <div class="qm-card__body">
                <div class="qm-form">
                    <h2>New chapter</h2>
                    <p class="qm-form__subtitle">Adding to <strong>{{subject.name}}</strong></p>
                    <form action="#" method="POST">
                        <div class="qm-field">
                            <label for="name">Chapter name</label>
                            <input type="text" id="name" name="name" placeholder="e.g. Linear Algebra" required>
                        </div>
                        <div class="qm-field">
                            <label for="desc">Description</label>
                            <textarea id="desc" name="desc" placeholder="What does this chapter cover?"></textarea>
                        </div>
                        <div class="qm-flex qm-flex--gap-sm">
                            <button type="submit" class="qm-btn qm-btn--primary" style="flex:1">Save chapter</button>
                            <a href="/admin/{{name}}" class="qm-btn qm-btn--secondary" style="flex:1">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
