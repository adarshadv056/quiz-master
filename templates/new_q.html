<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New question - Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    {%include 'admin_nav.html'%}
    <div class="qm-page">
        <div class="qm-card qm-card--lifted" style="max-width:560px;margin:0 auto">
            <div class="qm-card__body">
                <div class="qm-form">
                    <h2>New question</h2>
                    {%if chapter%}
                    <p class="qm-form__subtitle">Adding to <strong>{{chapter.name}}</strong></p>
                    {%endif%}
                    <form action="#" method="POST">
                        {% if mssg %}
                        <div class="qm-msg qm-msg--error">{{mssg}}</div>
                        {% endif %}
                        <div class="qm-field">
                            <label for="id">Chapter ID</label>
                            <input type="text" id="name" name="id" value="{{chapter.id}}" required>
                        </div>
                        <div class="qm-field">
                            <label for="question_title">Question title</label>
                            <input type="text" id="question_title" name="question_title" placeholder="A short label for this question" required>
                        </div>
                        <div class="qm-field">
                            <label for="question_statement">Question</label>
                            <textarea id="question_statement" name="question_statement" rows="4" placeholder="Write the full question here" required></textarea>
                        </div>
                        <div class="qm-qblock">
                            <div class="qm-qblock__title">Answer choices (single correct)</div>
                            <div class="qm-field">
                                <label for="option_1">Option 1</label>
                                <input type="text" name="option_1" id="option_1" required>
                            </div>
                            <div class="qm-field">
                                <label for="option_2">Option 2</label>
                                <input type="text" name="option_2" id="option_2" required>
                            </div>
                            <div class="qm-field">
                                <label for="option_3">Option 3</label>
                                <input type="text" name="option_3" id="option_3" required>
                            </div>
                            <div class="qm-field">
                                <label for="option_4">Option 4</label>
                                <input type="text" name="option_4" id="option_4" required>
                            </div>
                            <div class="qm-field">
                                <label for="correct_option">Correct answer</label>
                                <select name="correct_option" id="correct_option" required>
                                    <option value="1">Option 1</option>
                                    <option value="2">Option 2</option>
                                    <option value="3">Option 3</option>
                                    <option value="4">Option 4</option>
                                </select>
                            </div>
                        </div>
                        <div class="qm-flex qm-flex--gap-sm">
                            <button type="submit" class="qm-btn qm-btn--primary" style="flex:1">Save question</button>
                            <a href="/admin/quiz_management/{{name}}" class="qm-btn qm-btn--secondary" style="flex:1">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
