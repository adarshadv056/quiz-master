<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Quiz Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="qm-auth">
        <div class="qm-auth__card">
            <div class="qm-auth__logo"><span>QM</span> Quiz Master</div>
            <div class="qm-form qm-form--narrow">
                <h2>Welcome back</h2>
                <p class="qm-form__subtitle">Sign in to your account</p>
                <form action="/login" method="POST">
                    <div class="qm-field">
                        <label for="email">Email address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="qm-field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="qm-btn qm-btn--primary qm-btn--block qm-btn--lg">Sign in</button>
                </form>
                {% if mssg %}
                <div class="qm-msg {% if mssg=='Invalid Credentials' %}qm-msg--error{% else %}qm-msg--success{% endif %}">{{mssg}}</div>
                {% endif %}
                <div class="qm-auth__footer">
                    New here? <a href="/register">Create an account</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
